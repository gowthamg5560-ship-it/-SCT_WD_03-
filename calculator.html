<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator Web Application</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#141e30,#243b55);padding:20px}
.calculator{width:350px;background:#1e1e1e;padding:20px;border-radius:20px;box-shadow:0 15px 40px rgba(0,0,0,.5)}
.title{text-align:center;color:white;margin-bottom:15px;font-size:24px}
.display{width:100%;height:90px;background:#111;color:white;border-radius:12px;margin-bottom:15px;padding:15px;text-align:right;overflow:hidden}
#previous{color:#888;font-size:16px;height:25px}
#current{font-size:36px;font-weight:bold;white-space:nowrap}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{height:60px;border:none;border-radius:12px;font-size:20px;font-weight:bold;cursor:pointer;transition:.15s;background:#333;color:white}
button:hover{transform:scale(1.04);background:#444}
button:active{transform:scale(.95)}
.operator{background:#ff9500}.operator:hover{background:#ffad33}
.function{background:#666}.equal{background:#2196f3}.equal:hover{background:#42a5f5}
.zero{grid-column:span 2}.error{color:#ff5252!important}
.keyboard-info{text-align:center;color:#aaa;margin-top:15px;font-size:13px}
@media(max-width:400px){.calculator{width:100%}}
</style>
</head>
<body>
<div class="calculator">
<div class="title">Calculator</div>
<div class="display"><div id="previous"></div><div id="current">0</div></div>
<div class="buttons">
<button class="function" data-action="clear">AC</button>
<button class="function" data-action="delete">DEL</button>
<button class="function" data-action="percent">%</button>
<button class="operator" data-operator="/">÷</button>
<button data-number="7">7</button><button data-number="8">8</button><button data-number="9">9</button><button class="operator" data-operator="*">×</button>
<button data-number="4">4</button><button data-number="5">5</button><button data-number="6">6</button><button class="operator" data-operator="-">−</button>
<button data-number="1">1</button><button data-number="2">2</button><button data-number="3">3</button><button class="operator" data-operator="+">+</button>
<button class="zero" data-number="0">0</button><button data-number=".">.</button><button class="equal" data-action="equals">=</button>
</div>
<div class="keyboard-info">Keyboard: 0-9, +, -, *, /, %, Enter, Backspace, Escape</div>
</div>
<script>
const currentDisplay=document.getElementById("current"),previousDisplay=document.getElementById("previous");
let currentInput="0",previousInput="",operator=null,shouldResetDisplay=false;
function updateDisplay(){currentDisplay.textContent=currentInput;previousDisplay.textContent=previousInput&&operator?`${previousInput} ${displayOperator(operator)}`:""}
function displayOperator(op){return op==="*"?"×":op==="/"?"÷":op==="-"?"−":op}
function inputNumber(n){if(currentInput==="Error")clearCalculator();if(shouldResetDisplay){currentInput=n;shouldResetDisplay=false}else{if(n==="."&&currentInput.includes("."))return;if(currentInput==="0"&&n!==".")currentInput=n;else currentInput+=n}updateDisplay()}
function chooseOperator(op){if(currentInput==="Error")return;if(operator!==null&&!shouldResetDisplay)calculate();previousInput=currentInput;operator=op;shouldResetDisplay=true;updateDisplay()}
function calculate(){if(operator===null||previousInput==="")return;const a=parseFloat(previousInput),b=parseFloat(currentInput);if(isNaN(a)||isNaN(b)){showError("Invalid input");return}let result;switch(operator){case"+":result=a+b;break;case"-":result=a-b;break;case"*":result=a*b;break;case"/":if(b===0){showError("Cannot divide by zero");return}result=a/b;break;default:return}currentInput=Number(result.toFixed(10)).toString();previousInput="";operator=null;shouldResetDisplay=true;currentDisplay.classList.remove("error");updateDisplay()}
function clearCalculator(){currentInput="0";previousInput="";operator=null;shouldResetDisplay=false;currentDisplay.classList.remove("error");updateDisplay()}
function deleteNumber(){if(currentInput==="Error"){clearCalculator();return}if(shouldResetDisplay)return;currentInput=currentInput.length===1?"0":currentInput.slice(0,-1);updateDisplay()}
function percentage(){if(currentInput==="Error")return;const n=parseFloat(currentInput);if(isNaN(n)){showError("Invalid number");return}currentInput=(n/100).toString();updateDisplay()}
function showError(msg){currentInput="Error";previousInput=msg;operator=null;shouldResetDisplay=true;currentDisplay.classList.add("error");currentDisplay.textContent="Error";previousDisplay.textContent=msg}
document.querySelectorAll("[data-number]").forEach(b=>b.addEventListener("click",()=>inputNumber(b.dataset.number)));
document.querySelectorAll("[data-operator]").forEach(b=>b.addEventListener("click",()=>chooseOperator(b.dataset.operator)));
document.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>{const a=b.dataset.action;if(a==="clear")clearCalculator();else if(a==="delete")deleteNumber();else if(a==="percent")percentage();else if(a==="equals")calculate()}));
document.addEventListener("keydown",e=>{const k=e.key;if(/[0-9]/.test(k))inputNumber(k);else if(k===".")inputNumber(".");else if(["+","-","*","/"].includes(k))chooseOperator(k);else if(k==="Enter"||k==="=")calculate();else if(k==="Backspace")deleteNumber();else if(k==="Escape")clearCalculator();else if(k==="%")percentage()});
updateDisplay();
</script>
</body>
</html>
