<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator Web Application</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
            padding: 20px;
        }

        .calculator {
            width: 350px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        .title {
            text-align: center;
            color: white;
            margin-bottom: 15px;
            font-size: 24px;
        }

        .display {
            width: 100%;
            height: 90px;
            background: #111;
            color: white;
            border-radius: 12px;
            margin-bottom: 15px;
            padding: 15px;
            text-align: right;
            overflow: hidden;
        }

        #previous {
            color: #888;
            font-size: 16px;
            height: 25px;
        }

        #current {
            font-size: 36px;
            font-weight: bold;
            white-space: nowrap;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s;
            background: #333;
            color: white;
        }

        button:hover {
            transform: scale(1.04);
            background: #444;
        }

        button:active {
            transform: scale(0.95);
        }

        .operator {
            background: #ff9500;
        }

        .operator:hover {
            background: #ffad33;
        }

        .function {
            background: #666;
        }

        .equal {
            background: #2196f3;
        }

        .equal:hover {
            background: #42a5f5;
        }

        .zero {
            grid-column: span 2;
        }

        .error {
            color: #ff5252 !important;
        }

        .keyboard-info {
            text-align: center;
            color: #aaa;
            margin-top: 15px;
            font-size: 13px;
        }

        @media (max-width: 400px) {
            .calculator {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="calculator">

    <div class="title">Calculator</div>

    <div class="display">
        <div id="previous"></div>
        <div id="current">0</div>
    </div>

    <div class="buttons">

        <button class="function" data-action="clear">AC</button>
        <button class="function" data-action="delete">DEL</button>
        <button class="function" data-action="percent">%</button>
        <button class="operator" data-operator="/">÷</button>

        <button data-number="7">7</button>
        <button data-number="8">8</button>
        <button data-number="9">9</button>
        <button class="operator" data-operator="*">×</button>

        <button data-number="4">4</button>
        <button data-number="5">5</button>
        <button data-number="6">6</button>
        <button class="operator" data-operator="-">−</button>

        <button data-number="1">1</button>
        <button data-number="2">2</button>
        <button data-number="3">3</button>
        <button class="operator" data-operator="+">+</button>

        <button class="zero" data-number="0">0</button>
        <button data-number=".">.</button>
        <button class="equal" data-action="equals">=</button>

    </div>

    <div class="keyboard-info">
        Keyboard supported: 0-9, +, -, *, /, %, Enter, Backspace, Escape
    </div>

</div>

<script>

    // ============================================
    // DOM ELEMENTS
    // ============================================

    const currentDisplay = document.getElementById("current");
    const previousDisplay = document.getElementById("previous");

    const numberButtons = document.querySelectorAll("[data-number]");
    const operatorButtons = document.querySelectorAll("[data-operator]");
    const actionButtons = document.querySelectorAll("[data-action]");


    // ============================================
    // CALCULATOR VARIABLES
    // ============================================

    let currentInput = "0";
    let previousInput = "";
    let operator = null;
    let shouldResetDisplay = false;


    // ============================================
    // UPDATE DISPLAY
    // ============================================

    function updateDisplay() {

        currentDisplay.textContent = currentInput;

        previousDisplay.textContent =
            previousInput && operator
                ? `${previousInput} ${displayOperator(operator)}`
                : "";

    }


    // Convert programming operators into calculator symbols

    function displayOperator(op) {

        if (op === "*") return "×";
        if (op === "/") return "÷";
        if (op === "-") return "−";

        return op;
    }


    // ============================================
    // INPUT NUMBER
    // ============================================

    function inputNumber(number) {

        if (currentInput === "Error") {
            clearCalculator();
        }

        if (shouldResetDisplay) {

            currentInput = number;
            shouldResetDisplay = false;

        } else {

            if (number === "." && currentInput.includes(".")) {
                return;
            }

            if (currentInput === "0" && number !== ".") {
                currentInput = number;
            } else {
                currentInput += number;
            }
        }

        updateDisplay();
    }


    // ============================================
    // CHOOSE OPERATOR
    // ============================================

    function chooseOperator(selectedOperator) {

        if (currentInput === "Error") {
            return;
        }

        if (operator !== null && !shouldResetDisplay) {
            calculate();
        }

        previousInput = currentInput;
        operator = selectedOperator;
        shouldResetDisplay = true;

        updateDisplay();
    }


    // ============================================
    // CALCULATE RESULT
    // ============================================

    function calculate() {

        if (operator === null || previousInput === "") {
            return;
        }

        const firstNumber = parseFloat(previousInput);
        const secondNumber = parseFloat(currentInput);

        if (isNaN(firstNumber) || isNaN(secondNumber)) {
            showError("Invalid input");
            return;
        }

        let result;

        try {

            switch (operator) {

                case "+":
                    result = firstNumber + secondNumber;
                    break;

                case "-":
                    result = firstNumber - secondNumber;
                    break;

                case "*":
                    result = firstNumber * secondNumber;
                    break;

                case "/":

                    if (secondNumber === 0) {
                        showError("Cannot divide by zero");
                        return;
                    }

                    result = firstNumber / secondNumber;
                    break;

                default:
                    return;
            }

            // Avoid very long decimal results
            result = Number(result.toFixed(10));

            currentInput = result.toString();

            previousInput = "";
            operator = null;
            shouldResetDisplay = true;

            updateDisplay();

        } catch (error) {

            showError("Calculation error");
        }
    }


    // ============================================
    // CLEAR CALCULATOR
    // ============================================

    function clearCalculator() {

        currentInput = "0";
        previousInput = "";
        operator = null;
        shouldResetDisplay = false;

        currentDisplay.classList.remove("error");

        updateDisplay();
    }


    // ============================================
    // DELETE LAST CHARACTER
    // ============================================

    function deleteNumber() {

        if (currentInput === "Error") {
            clearCalculator();
            return;
        }

        if (shouldResetDisplay) {
            return;
        }

        if (currentInput.length === 1) {

            currentInput = "0";

        } else {

            currentInput = currentInput.slice(0, -1);
        }

        updateDisplay();
    }


    // ============================================
    // PERCENTAGE
    // ============================================

    function percentage() {

        if (currentInput === "Error") {
            return;
        }

        const number = parseFloat(currentInput);

        if (isNaN(number)) {
            showError("Invalid number");
            return;
        }

        currentInput = (number / 100).toString();

        updateDisplay();
    }


    // ============================================
    // ERROR HANDLING
    // ============================================

    function showError(message) {

        currentInput = "Error";
        previousInput = message;
        operator = null;
        shouldResetDisplay = true;

        currentDisplay.classList.add("error");

        currentDisplay.textContent = "Error";
        previousDisplay.textContent = message;
    }


    // ============================================
    // NUMBER BUTTON EVENTS
    // ============================================

    numberButtons.forEach(button => {

        button.addEventListener("click", () => {

            currentDisplay.classList.remove("error");

            inputNumber(button.dataset.number);

        });

    });


    // ============================================
    // OPERATOR BUTTON EVENTS
    // ============================================

    operatorButtons.forEach(button => {

        button.addEventListener("click", () => {

            currentDisplay.classList.remove("error");

            chooseOperator(button.dataset.operator);

        });

    });


    // ============================================
    // ACTION BUTTON EVENTS
    // ============================================

    actionButtons.forEach(button => {

        button.addEventListener("click", () => {

            const action = button.dataset.action;

            if (action === "clear") {
                clearCalculator();
            }

            else if (action === "delete") {
                deleteNumber();
            }

            else if (action === "percent") {
                percentage();
            }

            else if (action === "equals") {
                calculate();
            }

        });

    });


    // ============================================
    // KEYBOARD INPUT
    // ============================================

    document.addEventListener("keydown", event => {

        const key = event.key;

        // Numbers
        if (/[0-9]/.test(key)) {

            inputNumber(key);
        }

        // Decimal
        else if (key === ".") {

            inputNumber(".");
        }

        // Operators
        else if (["+", "-", "*", "/"].includes(key)) {

            chooseOperator(key);
        }

        // Equal / Enter
        else if (key === "Enter" || key === "=") {

            calculate();
        }

        // Backspace
        else if (key === "Backspace") {

            deleteNumber();
        }

        // Escape / Clear
        else if (key === "Escape") {

            clearCalculator();
        }

        // Percentage
        else if (key === "%") {

            percentage();
        }

    });


    // ============================================
    // INITIAL DISPLAY
    // ============================================

    updateDisplay();

</script>

</body>
  </html>
